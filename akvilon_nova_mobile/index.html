<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Аквилон НОВА mobile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="click-area" role="link" tabindex="0" aria-label="Аквилон НОВА">
    <div class="banner">
      <img class="photo" src="images/fon.jpg" alt="" style="opacity:0;">
      <img class="logo" src="images/logo_nova.svg" alt="Аквилон НОВА">

      <div class="frame frame1" style="opacity:0;">
        <div class="headline headline-1">
          <span class="line l1" style="opacity:0;">Скидки до&nbsp;<span class="green">38%</span></span>
        </div>
      </div>

      <div class="frame frame2" style="opacity:0;">
        <div class="headline headline-2">
          <span class="line l1" style="opacity:0;">Первый взнос&nbsp;<span class="green">0&nbsp;₽</span></span>
        </div>
      </div>

      <div class="frame frame3" style="opacity:0;">
        <div class="disclaimer-panel">
          <div class="disclaimer" style="opacity:0;">
            РЕКЛАМА. РЕКЛАМОДАТЕЛЬ <span class="nowrap">ООО&nbsp;«АКВИЛОН&nbsp;НЕДВИЖИМОСТЬ».</span>
            <span class="nowrap">ИНН&nbsp;2901291711.</span> ЗАСТРОЙЩИК
            <span class="nowrap">ООО&nbsp;СЗ&nbsp;«ПРИМОРСКИЙ&nbsp;ПЛЮС».</span> ПРОЕКТНАЯ ДЕКЛАРАЦИЯ
            <span class="nowrap">НА&nbsp;НАШ.ДОМ.РФ.</span> РАССРОЧКА <span class="nowrap">ОТ&nbsp;ЗАСТРОЙЩИКА.</span>
            СРОКИ АКЦИИ <span class="nowrap">С&nbsp;01.10.2026&nbsp;Г.</span>
            <span class="nowrap">ПО&nbsp;31.10.2026&nbsp;Г.</span> ПОДРОБНЕЕ <span class="nowrap">НА&nbsp;GROUP-AKVILON.RU.</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script nonce="%request.eid1%">
    var flashVars = {
      reference: "%request.reference%",
      link: "%banner.user1%",
      target: "%banner.target%",
      rnd: parseInt("%request.place_random%") || parseInt("%system.random%"),
      events: ["","%banner.event1%","%banner.event2%","%banner.event3%","%banner.event4%","%banner.event5%","%banner.event6%","%banner.event7%","%banner.event8%","%banner.event9%","%banner.event10%","%banner.event11%","%banner.event12%","%banner.event13%","%banner.event14%","%banner.event15%","%banner.event16%","%banner.event17%","%banner.event18%","%banner.event19%","%banner.event20%","%banner.event21%","%banner.event22%","%banner.event23%","%banner.event24%","%banner.event25%","%banner.event26%","%banner.event27%","%banner.event28%","%banner.event29%","%banner.event30%"]
    };
  </script>
  <script nonce="%request.eid1%" type="text/javascript" src="https://banners.adfox.ru/files/adfox_HTML5.js"></script>
  <script nonce="%request.eid1%" src="script.js"></script>
</body>
</html>
