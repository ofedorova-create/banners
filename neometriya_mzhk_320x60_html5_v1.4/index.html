<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Неометрия МЖК Mobile 320×60</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="click-area" aria-label="Рекламный баннер">
    <div class="banner">
      <div class="tech-stripe" aria-hidden="true"></div>

      <section class="frame frame-1" aria-hidden="false">
        <div class="blue-panel"></div>
        <img class="photo" src="images/photo1.jpg" alt="">
        <img class="plate plate-top" src="images/topplate.svg" alt="">
        <img class="plate plate-bottom" src="images/bottomplate.svg" alt="">
        <img class="logo logo-mjk" src="images/logo_mjk.svg" alt="">
        <img class="logo logo-neometria" src="images/logo_neometria.svg" alt="">
        <div class="text f1-head">Старт продаж</div>
        <div class="text f1-sub"><span class="sub-line f1-sub-line1">Рассрочка</span><span class="sub-line f1-sub-line2">до 36 месяцев</span></div>
      </section>

      <section class="frame frame-2" style="opacity:0" aria-hidden="true">
        <div class="blue-panel"></div>
        <img class="photo" src="images/photo2.jpg" alt="">
        <img class="plate plate-top" src="images/topplate.svg" alt="">
        <img class="plate plate-bottom" src="images/bottomplate.svg" alt="">
        <img class="logo logo-mjk" src="images/logo_mjk.svg" alt="">
        <img class="logo logo-neometria" src="images/logo_neometria.svg" alt="">
        <div class="text f2-head1">Квартиры</div>
        <div class="text f2-head2">бизнес-класса</div>
        <div class="text f2-head3">в Краснодаре</div>
      </section>

      <section class="frame frame-3 frame-legal" style="opacity:0" aria-hidden="true">
        <div class="legal-box"><div class="legal-copy">РЕКЛАМА. РЕКЛАМОДАТЕЛЬ ООО «НЕОАГЕНТСТВО». ИНН&nbsp;9703176621.
ЗАСТРОЙЩИК ООО СЗ «НОВАСТРОЙ». ПРОЕКТНАЯ ДЕКЛАРАЦИЯ
НА НАШ.ДОМ.РФ. РАССРОЧКА ОТ ЗАСТРОЙЩИКА. ПОДРОБНОСТИ
У МЕНЕДЖЕРОВ В ОТДЕЛЕ ПРОДАЖ. НЕ ЯВЛЯЕТСЯ ПУБЛИЧНОЙ ОФЕРТОЙ.</div></div>
      </section>
    </div>
  </div>

  <script nonce="%request.eid1%">
  var flashVars = {
    reference: "%request.reference%",
    link: "%banner.user1%",
    target: "%banner.target%",
    rnd: parseInt("%request.place_random%") ||
      parseInt("%system.random%"),
    events: [
      "",
      "%banner.event1%",
      "%banner.event2%",
      "%banner.event3%",
      "%banner.event4%",
      "%banner.event5%",
      "%banner.event6%",
      "%banner.event7%",
      "%banner.event8%",
      "%banner.event9%",
      "%banner.event10%",
      "%banner.event11%",
      "%banner.event12%",
      "%banner.event13%",
      "%banner.event14%",
      "%banner.event15%",
      "%banner.event16%",
      "%banner.event17%",
      "%banner.event18%",
      "%banner.event19%",
      "%banner.event20%",
      "%banner.event21%",
      "%banner.event22%",
      "%banner.event23%",
      "%banner.event24%",
      "%banner.event25%",
      "%banner.event26%",
      "%banner.event27%",
      "%banner.event28%",
      "%banner.event29%",
      "%banner.event30%"
    ]
  };
  </script>
  <script nonce="%request.eid1%" type="text/javascript" src="https://banners.adfox.ru/files/adfox_HTML5.js"></script>
  <script nonce="%request.eid1%" src="script.js"></script>
</body>
</html>
