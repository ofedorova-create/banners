<!doctype html>

<head>

  <title>Тен Основинские кварталы</title>

  <script nonce="%request.eid1%" type="text/javascript" src="https://banners.adfox.ru/files/adfox_HTML5.js"></script>

<body>

      <img class="photo" src="images/fon_r_d.jpg" alt="Тен Основинские кварталы">

          <div class="frame1-single">ОСЕНЬ ВЫГОДНАЯ СКИДКА!</div>
        </div>
      </div>

              <span class="discount-do">ДО</span>
              <span class="discount-main"><span class="discount-value">-15</span><span class="discount-percent">%</span></span>
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
