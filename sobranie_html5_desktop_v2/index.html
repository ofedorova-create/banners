<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="ad.size" content="width=1200,height=200">
  <title>Собрание — 91% готовности дома</title>
  <link rel="stylesheet" href="style.css">
  <script nonce="%request.eid1%">
    var flashVars = {
      reference: "%request.reference%",
      link: "%banner.user1%",
      target: "%banner.target%",
      rnd: parseInt("%request.place_random%") || parseInt("%system.random%"),
      events: [
        "", "%banner.event1%", "%banner.event2%", "%banner.event3%", "%banner.event4%",
        "%banner.event5%", "%banner.event6%", "%banner.event7%", "%banner.event8%", "%banner.event9%",
        "%banner.event10%", "%banner.event11%", "%banner.event12%", "%banner.event13%", "%banner.event14%",
        "%banner.event15%", "%banner.event16%", "%banner.event17%", "%banner.event18%", "%banner.event19%",
        "%banner.event20%", "%banner.event21%", "%banner.event22%", "%banner.event23%", "%banner.event24%",
        "%banner.event25%", "%banner.event26%", "%banner.event27%", "%banner.event28%", "%banner.event29%",
        "%banner.event30%"
      ]
    };
  </script>
  <script nonce="%request.eid1%" src="https://banners.adfox.ru/files/adfox_HTML5.js"></script>
</head>
<body>
  <div class="click-area" role="link" aria-label="Перейти к предложению дома-резиденции Собрание">
    <main class="banner" aria-label="Реклама дома-резиденции Собрание">
      <section class="text-zone">
        <img class="project-logo animated project-logo-anim" src="images/logo_sobranie.svg" alt="Собрание — дом-резиденция" draggable="false">

        <div class="offer" aria-label="91% готовности дома">
          <span class="offer-number animated number-anim">91%</span>
          <span class="offer-copy animated copy-anim">готовности дома</span>
        </div>

        <div class="secondary animated secondary-anim">Квартиры элит-класса в&nbsp;центре Ростова</div>

        <div class="phone animated phone-anim">+7 (863) 204-60-87</div>

        <div class="legal-row">
          <img class="developer-logo animated developer-anim" src="images/logo_alyans.svg" alt="Альянс Групп — строительная компания" draggable="false">
          <div class="disclaimer animated disclaimer-anim">Застройщик: ООО «СЗ «Альянс Групп» ИНН:&nbsp;6161093783. Проектная декларация на&nbsp;наш.дом.рф. Реклама.</div>
        </div>
      </section>

      <figure class="photo-zone" aria-label="Дом-резиденция Собрание">
        <img src="images/photo.jpg" alt="Архитектура дома-резиденции Собрание" draggable="false">
      </figure>
    </main>
  </div>

  <script nonce="%request.eid1%" src="script.js"></script>
</body>
</html>
