<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="ad.size" content="width=320,height=60">
  <title>Облака — 320x60</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="click-area" role="button" aria-label="Рекламный баннер">
    <div class="banner" id="banner">
      <div class="orange-base" aria-hidden="true"></div>

      <section class="frame frame-1" aria-label="Кадр 1">
        <img class="photo" src="images/fotooblaka_crop.jpg" alt="">
        <div class="headline">КВАРТИРЫ С ВИДОМ</div>
        <div class="subhead">НА МОРЕ, ГОРЫ И<br>ВИНОГРАДНИКИ</div>
      </section>

      <section class="frame frame-2" aria-label="Кадр 2">
        <div class="disclaimer">РЕКЛАМА. РЕКЛАМОДАТЕЛЬ ООО «НЕОМЕТРИЯ», ИНН&nbsp;2309149560. ЗАСТРОЙЩИК<br>ООО «СЗ «БЕЛЫЕ РОСЫ». ПРОЕКТНАЯ ДЕКЛАРАЦИЯ НА&nbsp;НАШ.ДОМ.РФ.<br>ПОДРОБНОСТИ НА&nbsp;NEOMETRIA.RU. НЕ ЯВЛЯЕТСЯ ПУБЛИЧНОЙ ОФЕРТОЙ</div>
      </section>

      <div class="logo-plate logo-plate-top" aria-hidden="true"></div>
      <img class="logo logo-oblaka" src="images/logooblaka.svg" alt="облака">
      <div class="logo-plate logo-plate-bottom" aria-hidden="true"></div>
      <img class="logo logo-neometria" src="images/logoneometria.svg" alt="неометрия">

      <div class="technical-strip" aria-hidden="true"></div>
    </div>
  </div>

  <script nonce="%request.eid1%">
  var flashVars = {
    reference: "%request.reference%",
    link: "%banner.user1%",
    target: "%banner.target%",
    rnd: parseInt("%request.place_random%") || parseInt("%system.random%"),
    events: [
      "",
      "%banner.event1%",
      "%banner.event2%",
      "%banner.event3%",
      "%banner.event4%",
      "%banner.event5%",
      "%banner.event6%",
      "%banner.event7%",
      "%banner.event8%",
      "%banner.event9%",
      "%banner.event10%",
      "%banner.event11%",
      "%banner.event12%",
      "%banner.event13%",
      "%banner.event14%",
      "%banner.event15%",
      "%banner.event16%",
      "%banner.event17%",
      "%banner.event18%",
      "%banner.event19%",
      "%banner.event20%",
      "%banner.event21%",
      "%banner.event22%",
      "%banner.event23%",
      "%banner.event24%",
      "%banner.event25%",
      "%banner.event26%",
      "%banner.event27%",
      "%banner.event28%",
      "%banner.event29%",
      "%banner.event30%"
    ]
  };
  </script>
  <script nonce="%request.eid1%" type="text/javascript" src="https://banners.adfox.ru/files/adfox_HTML5.js"></script>
  <script nonce="%request.eid1%" src="script.js"></script>
</body>
</html>
