<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Альянс / Курортный квартал Ривьера — HTML5-баннер 1200×200</title>
  <link rel="stylesheet" href="style.css">

  <script nonce="%request.eid1%">
    var flashVars = {
      reference: "%request.reference%",
      link: "%banner.user1%",
      target: "%banner.target%",
      rnd: parseInt("%request.place_random%") || parseInt("%system.random%"),
      events: [
        "",
        "%banner.event1%",
        "%banner.event2%",
        "%banner.event3%",
        "%banner.event4%",
        "%banner.event5%",
        "%banner.event6%",
        "%banner.event7%",
        "%banner.event8%",
        "%banner.event9%",
        "%banner.event10%",
        "%banner.event11%",
        "%banner.event12%",
        "%banner.event13%",
        "%banner.event14%",
        "%banner.event15%",
        "%banner.event16%",
        "%banner.event17%",
        "%banner.event18%",
        "%banner.event19%",
        "%banner.event20%",
        "%banner.event21%",
        "%banner.event22%",
        "%banner.event23%",
        "%banner.event24%",
        "%banner.event25%",
        "%banner.event26%",
        "%banner.event27%",
        "%banner.event28%",
        "%banner.event29%",
        "%banner.event30%"
      ]
    };
  </script>
  <script nonce="%request.eid1%" type="text/javascript" src="https://banners.adfox.ru/files/adfox_HTML5.js"></script>
</head>
<body>
  <div class="click-area" role="button" aria-label="Открыть рекламное предложение">
    <div class="banner">
      <img class="background-photo" src="images/fotofon.jpg" alt="">
      <div class="background-shade" aria-hidden="true"></div>

      <section class="frame frame-1" aria-label="Курорт в центре города">
        <div class="frame-1__title">
          <span class="frame-1__line frame-1__line--semibold">ТОТ САМЫЙ ЖК,</span>
          <span class="frame-1__line">ГДЕ КУРОРТ</span>
          <span class="frame-1__line">В ЦЕНТРЕ ГОРОДА</span>
        </div>
        <img class="frame-1__logo" src="images/logo.svg" alt="Ривьера, курортный квартал">
      </section>

      <section class="frame frame-2" aria-label="Контактная и юридическая информация">
        <img class="frame-2__logo" src="images/logo2.svg" alt="Альянс Групп, строительная компания">

        <div class="frame-2__phone">
          <span>+7 (863)</span>
          <span>204-62-96</span>
        </div>

        <div class="frame-2__legal">
          <span>РЕКЛАМА. РЕКЛАМОДАТЕЛЬ И ЗАСТРОЙЩИК ООО «СЗ «АЛЬЯНС ИНВЕСТ», ИНН 6161095068.</span>
          <span>ПРОЕКТНАЯ ДЕКЛАРАЦИЯ НА НАШ.ДОМ.РФ. ПОДРОБНОСТИ НА ALYANCE-GROUP.RU.</span>
        </div>
      </section>
    </div>
  </div>

  <script nonce="%request.eid1%" src="script.js"></script>
</body>
</html>
