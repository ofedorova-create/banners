<!doctype html>

<head>

  <script nonce="%request.eid1%">

<body>
  <div class="click-area" aria-label="Тен Екатерининский парк">
    <div class="banner">
      <img class="hero-photo" src="images/ten_ekaterininsky_park.jpg" alt="">
      <img class="logo logo-persistent" src="images/logo_ten.svg" alt="TEN">

      <section class="frame frame-1" aria-hidden="true">
        <div class="frame1-title">

        <div class="frame2-title">
          <div class="frame2-line frame2-line-single">НА КВАРТИРУ</div>
        </div>
        <div class="discount-row">
          <span class="discount-to">ДО</span>
          <span class="discount-value">-12<span class="percent-sign">%</span></span>
        </div>
      </section>

      </section>
    </div>
  </div>

</html>
