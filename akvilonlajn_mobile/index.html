<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Аквилонлайн mobile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="click-area" role="link" tabindex="0" aria-label="Аквилонлайн">
    <div class="banner">
      <img class="photo" src="images/fon.jpg" alt="" style="opacity:0;">
      <img class="logo" src="images/logo_akvilonline.svg" alt="Аквилонлайн">

      <div class="frame frame1" style="opacity:0;">
        <div class="headline headline-1">
          <span class="line l1" style="opacity:0;">СТАРТ ПРОДАЖ</span>
          <span class="line l2" style="opacity:0;">НОВОЙ ОЧЕРЕДИ!</span>
        </div>
      </div>

      <div class="frame frame2" style="opacity:0;">
        <div class="headline headline-2">
          <span class="line l1" style="opacity:0;"><span class="gray">СКИДКА&nbsp;</span><span class="green">200 000₽</span></span>
          <span class="line l2" style="opacity:0;"><span class="gray">ЗА МАТКАПИТАЛ!</span></span>
        </div>
      </div>

      <div class="frame frame3" style="opacity:0;">
        <div class="disclaimer-panel">
          <div class="disclaimer" style="opacity:0;">
            <span class="disc-line">РЕКЛАМА. РЕКЛАМОДАТЕЛЬ ООО «КВАТРЕ СТАР». ИНН 7810691447.</span>
            <span class="disc-line">ЗАСТРОЙЩИК ООО СЗ «ОНЛАЙН». ПРОЕКТНАЯ ДЕКЛАРАЦИЯ</span>
            <span class="disc-line">НА НАШ.ДОМ.РФ. СРОКИ АКЦИИ С 01.10.2026 Г. ПО 31.10.2026 Г.</span>
            <span class="disc-line">ПОДРОБНЕЕ НА GROUP-AKVILON.RU</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script nonce="%request.eid1%">
    var flashVars = {
      reference: "%request.reference%",
      link: "%banner.user1%",
      target: "%banner.target%",
      rnd: parseInt("%request.place_random%") || parseInt("%system.random%"),
      events: ["","%banner.event1%","%banner.event2%","%banner.event3%","%banner.event4%","%banner.event5%","%banner.event6%","%banner.event7%","%banner.event8%","%banner.event9%","%banner.event10%","%banner.event11%","%banner.event12%","%banner.event13%","%banner.event14%","%banner.event15%","%banner.event16%","%banner.event17%","%banner.event18%","%banner.event19%","%banner.event20%","%banner.event21%","%banner.event22%","%banner.event23%","%banner.event24%","%banner.event25%","%banner.event26%","%banner.event27%","%banner.event28%","%banner.event29%","%banner.event30%"]
    };
  </script>
  <script nonce="%request.eid1%" type="text/javascript" src="https://banners.adfox.ru/files/adfox_HTML5.js"></script>
  <script nonce="%request.eid1%" src="script.js"></script>
</body>
</html>
