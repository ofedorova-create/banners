<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="ad.size" content="width=1200,height=200">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Тен Старт</title>
  <link rel="stylesheet" href="style.css">
  <script nonce="%request.eid1%">
    var flashVars = {
      reference: "%request.reference%",
      link: "%banner.user1%",
      target: "%banner.target%",
      rnd: parseInt("%request.place_random%") || parseInt("%system.random%"),
      events: ["", "%banner.event1%", "%banner.event2%", "%banner.event3%", "%banner.event4%", "%banner.event5%", "%banner.event6%", "%banner.event7%", "%banner.event8%", "%banner.event9%", "%banner.event10%", "%banner.event11%", "%banner.event12%", "%banner.event13%", "%banner.event14%", "%banner.event15%", "%banner.event16%", "%banner.event17%", "%banner.event18%", "%banner.event19%", "%banner.event20%", "%banner.event21%", "%banner.event22%", "%banner.event23%", "%banner.event24%", "%banner.event25%", "%banner.event26%", "%banner.event27%", "%banner.event28%", "%banner.event29%", "%banner.event30%"]
    };
  </script>
  <script nonce="%request.eid1%" src="https://banners.adfox.ru/files/adfox_HTML5.js"></script>
</head>
<body>
  <div class="click-area" aria-label="Тен Старт">
    <div class="banner">
      <section class="left-panel" aria-hidden="true">
        <img class="logo logo-project" src="assets/logo_gk.svg" alt="">
        <img class="logo logo-developer" src="assets/logo_zastroishika.svg" alt="">

        <div class="text-state state-1">
          <div class="headline-main">Старт продаж</div>
        </div>

        <div class="text-state state-2">
          <div class="price-prefix">Квартиры от</div>
          <div class="price-value">6,7 млн руб</div>
        </div>

        <div class="text-state state-3">
          <div class="phone">+7 (921) 123-45-67</div>
          <div class="disclaimer">
            <span>РЕКЛАМА. РЕКЛАМОДАТЕЛЬ И ЗАСТРОЙЩИК ООО СЗ</span>
            <span>«ТКО ЛОГИСТИК». ИНН 6658538409. ПРОЕКТНЫЕ</span>
            <span>ДЕКЛАРАЦИИ НА НАШ.ДОМ.РФ. ПОДРОБНОСТИ НА</span>
            <span>TEN-STROY.RU.</span>
          </div>
        </div>
      </section>
      <div class="photo-zone" aria-hidden="true">
        <img class="photo" src="assets/photo.png" alt="">
      </div>
    </div>
  </div>
  <script nonce="%request.eid1%" src="script.js"></script>
</body>
</html>
